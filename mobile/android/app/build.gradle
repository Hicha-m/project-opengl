plugins { id 'com.android.application' }
def repo = rootProject.projectDir.parentFile.parentFile
def deps = new File(repo, 'build/mobile-deps')
def assetDirectory = new File(repo, 'build/mobile-assets')
if (!new File(deps, 'SDL/CMakeLists.txt').isFile() || !new File(assetDirectory, 'build/music/cinematic.wav').isFile()) {
    throw new GradleException('Run python3 scripts/prepare_mobile.py from the repository root before building Android.')
}
android {
    namespace 'io.github.hicha_m.space'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'io.github.hicha_m.space'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake {
            arguments '-DPROJECT_MOBILE=ON', '-DBUILD_TESTING=OFF', '-DANDROID_STL=c++_shared',
                "-DFETCHCONTENT_SOURCE_DIR_SDL3=${deps}/SDL", "-DFETCHCONTENT_SOURCE_DIR_GLM=${deps}/glm"
            targets 'project', 'SDL3-shared'
        } }
    }
    externalNativeBuild { cmake { path new File(repo, 'CMakeLists.txt'); version '3.22.1' } }
    sourceSets.main { java.srcDir new File(deps, 'SDL/android-project/app/src/main/java'); assets.srcDir assetDirectory }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging = true } }
    buildTypes { release { minifyEnabled false } }
}
