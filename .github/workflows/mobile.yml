name: Mobile MVP
on:
  workflow_dispatch:
  pull_request:
    paths: ['mobile/**', 'src/**', 'shaders/**', 'scripts/*mobile*', 'CMakeLists.txt', '.github/workflows/mobile.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sdkmanager "platforms;android-35" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Prepare mobile sources and assets
        run: python3 scripts/prepare_mobile.py
      - name: Build APK
        working-directory: mobile/android
        run: bash gradlew assembleDebug --no-daemon --max-workers=2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify app in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          disable-animations: true
          script: python3 scripts/verify_mobile.py android mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-mvp
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            build/mobile-evidence/
  ios:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: brew install cmake ffmpeg
      - name: Prepare mobile sources and assets
        run: python3 scripts/prepare_mobile.py
      - name: Configure simulator
        run: >-
          cmake -S . -B build/ios-simulator -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          -DFETCHCONTENT_SOURCE_DIR_SDL3="$PWD/build/mobile-deps/SDL"
          -DFETCHCONTENT_SOURCE_DIR_GLM="$PWD/build/mobile-deps/glm"
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO -DBUILD_TESTING=OFF
      - name: Build simulator app
        run: cmake --build build/ios-simulator --config Release --target project --parallel 3
      - name: Verify app in iPhone simulator
        run: python3 scripts/verify_mobile.py ios build/ios-simulator/runtime/project.app
      - name: Configure iPhone
        run: >-
          cmake -S . -B build/ios-device -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          -DFETCHCONTENT_SOURCE_DIR_SDL3="$PWD/build/mobile-deps/SDL"
          -DFETCHCONTENT_SOURCE_DIR_GLM="$PWD/build/mobile-deps/glm"
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO -DBUILD_TESTING=OFF
      - name: Build iPhone app without distribution signing
        run: cmake --build build/ios-device --config Release --target project --parallel 3
      - name: Archive iOS apps
        run: |
          ditto -c -k --keepParent build/ios-simulator/runtime/project.app build/ios-simulator.zip
          ditto -c -k --keepParent build/ios-device/runtime/project.app build/ios-device-unsigned.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-mvp
          path: |
            build/ios-*.zip
            build/mobile-evidence/
